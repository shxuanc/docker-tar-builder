name: Build Docker Image Tar
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Docker 镜像名（如 nginx:latest）'
        required: true
      platform:
        description: '目标平台'
        required: true
        default: 'linux/amd64'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU + Buildx 多架构支持
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull image
        run: docker pull --platform ${{ inputs.platform }} ${{ inputs.docker_image }}

      - name: Save as tar and gzip
        run: |
          NAME=$(echo "${{ inputs.docker_image }}" | tr '/:' '__')
          docker save ${{ inputs.docker_image }} -o ${NAME}.tar
          gzip ${NAME}.tar
          echo "TAR_NAME=${NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "${{ inputs.docker_image }}" \
            --notes "platform: ${{ inputs.platform }}" \
            "${TAR_NAME}"
